<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Villa Arriba - Jenga Colors</title>
    <style>
        /* =========================================
           Variables y Configuración Base
           ========================================= */
        :root {
            --rosa-claro: #F48FB1;
            --rosa-oscuro: #C2185B;
            --verde-claro: #A5D6A7;
            --verde-oscuro: #2E7D32;
            --azul-claro: #90CAF9;
            --azul-oscuro: #1565C0;
            --bg-color: #f8f9fa;
            --text-color: #333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden; /* Evita scroll accidental al jugar */
        }

        /* =========================================
           Tipografía y Cabecera
           ========================================= */
        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #2c3e50;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        p.subtitle {
            font-size: 1rem;
            color: #7f8c8d;
            margin-top: 5px;
        }

        /* =========================================
           Contenedor de la Ruleta y Puntero
           ========================================= */
        .roulette-container {
            position: relative;
            width: 300px;
            height: 300px;
            margin: 0 auto;
            filter: drop-shadow(0px 10px 20px rgba(0,0,0,0.15));
        }

        /* Puntero que indica el color ganador */
        .pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 30px solid #2c3e50;
            z-index: 10;
        }

        /* Diseño de la Ruleta usando conic-gradient */
        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 4px solid #fff;
            /* Transición suave para el giro */
            transition: transform 4s cubic-bezier(0.17, 0.67, 0.1, 1);
            background: conic-gradient(
                var(--rosa-claro) 0deg 60deg,
                var(--rosa-oscuro) 60deg 120deg,
                var(--verde-claro) 120deg 180deg,
                var(--verde-oscuro) 180deg 240deg,
                var(--azul-claro) 240deg 300deg,
                var(--azul-oscuro) 300deg 360deg
            );
        }

        /* Centro de la ruleta estético */
        .wheel::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            background-color: #fff;
            border-radius: 50%;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }

        /* =========================================
           Controles y Resultados
           ========================================= */
        .controls {
            margin-top: 3rem;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
        }

        button {
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            color: white;
            background-color: #2c3e50;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s, background-color 0.2s;
            text-transform: uppercase;
        }

        button:active {
            transform: scale(0.95);
        }

        button:disabled {
            background-color: #95a5a6;
            cursor: not-allowed;
            transform: scale(1);
        }

        .result {
            font-size: 1.5rem;
            font-weight: 700;
            min-height: 2rem;
            text-transform: uppercase;
            transition: color 0.3s;
        }
    </style>
</head>
<body>

    <header>
        <h1>Villa Arriba</h1>
        <p class="subtitle">Ruleta Jenga</p>
    </header>

    <div class="roulette-container">
        <div class="pointer"></div>
        <div class="wheel" id="wheel"></div>
    </div>

    <div class="controls">
        <button id="spinBtn">Tirar Ruleta</button>
        <div class="result" id="resultDisplay">¡Preparados!</div>
    </div>

    <script>
        /* =========================================
           Lógica de la Ruleta
           ========================================= */
        const wheel = document.getElementById('wheel');
        const spinBtn = document.getElementById('spinBtn');
        const resultDisplay = document.getElementById('resultDisplay');

        // Mantenemos el estado de rotación global para que los giros sean acumulativos
        let currentRotation = 0;

        // Definición de las porciones (60 grados cada una)
        const slices = [
            { name: 'Rosa Claro', min: 0, max: 60, color: '#F48FB1' },
            { name: 'Rosa Oscuro', min: 60, max: 120, color: '#C2185B' },
            { name: 'Verde Claro', min: 120, max: 180, color: '#A5D6A7' },
            { name: 'Verde Oscuro', min: 180, max: 240, color: '#2E7D32' },
            { name: 'Azul Claro', min: 240, max: 300, color: '#90CAF9' },
            { name: 'Azul Oscuro', min: 300, max: 360, color: '#1565C0' }
        ];

        spinBtn.addEventListener('click', () => {
            // Deshabilitar botón durante el giro para evitar bugs
            spinBtn.disabled = true;
            resultDisplay.textContent = 'Girando...';
            resultDisplay.style.color = '#7f8c8d';

            // Cálculo de rotación: de 5 a 10 vueltas completas extra + grados aleatorios
            const extraSpins = Math.floor(Math.random() * 5 + 5) * 360; 
            const randomDegree = Math.floor(Math.random() * 360);
            
            currentRotation += extraSpins + randomDegree;
            
            // Aplicar la transformación CSS
            wheel.style.transform = `rotate(${currentRotation}deg)`;

            // Esperar a que termine la animación (4000ms coincidiendo con CSS)
            setTimeout(() => {
                // Cálculo del ángulo real en el que se ha detenido la ruleta
                const actualDegree = currentRotation % 360;
                
                // Dado que la ruleta gira en sentido horario, el punto "0" se mueve.
                // Para saber qué hay arriba (en el puntero), calculamos el inverso:
                const pointerAngle = (360 - actualDegree) % 360;

                // Encontrar el color ganador coherente con el ángulo actual
                const winningSlice = slices.find(s => pointerAngle >= s.min && pointerAngle < s.max);

                // Actualizar interfaz
                resultDisplay.textContent = `¡Toca: ${winningSlice.name}!`;
                resultDisplay.style.color = winningSlice.color;
                
                // Rehabilitar botón
                spinBtn.disabled = false;
            }, 4000); 
        });
    </script>
</body>
</html>
