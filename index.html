<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Villa Arriba - Jenga Colors</title>
    
    <!-- Meta etiquetas para PWA (Apple) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Villa Arriba">
    <link rel="apple-touch-icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAMAAAADACAMAAABwD9X7AAAAA1BMVEW//wCWv4fUAAAAWElEQVR4nO3BMQEAAADCoPVPbQwfoAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABwG744AAEbD4cAAAAAElFTkSuQmCC">
    
    <style>
        /* =========================================
           Variables y Sistema de Diseño (Estilo Apple)
           ========================================= */
        :root {
            /* Colores de la Ruleta */
            --rosa-claro: #FFB3D9;
            --rosa-oscuro: #FF3377;
            --verde-claro: #B3FFC6;
            --verde-oscuro: #33CC55;
            --azul-claro: #B3D9FF;
            --azul-oscuro: #0066FF;
            
            /* Colores UI */
            --bg-base: #F2F2F7;       /* Fondo general iOS */
            --bg-surface: #FFFFFF;    /* Fondo de tarjetas */
            --text-primary: #1C1C1E;
            --text-secondary: #8E8E93;
            --accent: #007AFF;        /* Azul Apple */
            --border-color: #E5E5EA;
            
            /* Medidas */
            --radius-lg: 20px;
            --radius-md: 12px;
            --shadow: 0 4px 14px rgba(0, 0, 0, 0.05);
            --safe-top: env(safe-area-inset-top, 20px);
            --safe-bottom: env(safe-area-inset-bottom, 20px);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: var(--safe-top);
            padding-bottom: calc(100px + var(--safe-bottom)); /* Espacio para el botón fijo */
        }

        /* =========================================
           Cabecera
           ========================================= */
        header {
            width: 100%;
            text-align: center;
            padding: 20px;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 15px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        /* =========================================
           Contenedor Principal (Max-width para tablets)
           ========================================= */
        .container {
            width: 100%;
            max-width: 450px;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

        /* =========================================
           Ruleta (Diseño Perfecto con Conic Gradient)
           ========================================= */
        .roulette-wrapper {
            position: relative;
            width: 280px;
            height: 280px;
            border-radius: 50%;
            background-color: var(--bg-surface);
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            padding: 10px;
        }

        .pointer {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 24px;
            height: 30px;
            background-color: var(--text-primary);
            clip-path: polygon(50% 100%, 0 0, 100% 0);
            z-index: 10;
        }

        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            /* El gradient crea cortes precisos sin bugs visuales */
            background: conic-gradient(
                var(--rosa-claro) 0deg 60deg,
                var(--rosa-oscuro) 60deg 120deg,
                var(--verde-claro) 120deg 180deg,
                var(--verde-oscuro) 180deg 240deg,
                var(--azul-claro) 240deg 300deg,
                var(--azul-oscuro) 300deg 360deg
            );
            transition: transform 4s cubic-bezier(0.1, 0.9, 0.2, 1); /* Curva muy suave */
            position: relative;
            box-shadow: inset 0 0 0 2px rgba(255,255,255,0.2);
        }

        /* Botón central decorativo de la ruleta */
        .wheel::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 45px;
            height: 45px;
            background-color: var(--bg-surface);
            border-radius: 50%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
        }

        /* =========================================
           Resultado
           ========================================= */
        .result-card {
            width: 100%;
            background: var(--bg-surface);
            padding: 20px;
            border-radius: var(--radius-lg);
            text-align: center;
            box-shadow: var(--shadow);
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.3s, transform 0.3s;
        }

        .result-card.active {
            opacity: 1;
            transform: translateY(0);
        }

        .result-title {
            font-size: 13px;
            text-transform: uppercase;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .result-color {
            font-size: 24px;
            font-weight: 800;
            margin-top: 5px;
        }

        /* =========================================
           Panel de Jugadores
           ========================================= */
        .players-section {
            width: 100%;
            background: var(--bg-surface);
            border-radius: var(--radius-lg);
            padding: 20px;
            box-shadow: var(--shadow);
        }

        .players-header {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .add-player-form {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .add-player-input {
            flex-grow: 1;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
            background-color: var(--bg-base);
        }

        .add-player-input:focus {
            border-color: var(--accent);
        }

        .add-btn {
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: var(--radius-md);
            padding: 0 20px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
        }

        .add-btn:active { opacity: 0.8; }

        .players-list {
            list-style: none;
            display: flex;
            flex-direction: column;
        }

        .player-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .player-item:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .player-name {
            font-size: 16px;
            font-weight: 500;
        }

        .score-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .score-badge {
            background-color: var(--bg-base);
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 15px;
            min-width: 40px;
            text-align: center;
        }

        .win-btn {
            background-color: var(--accent);
            color: white;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,122,255,0.3);
        }
        
        .win-btn:active { transform: scale(0.9); }

        .empty-state {
            text-align: center;
            color: var(--text-secondary);
            font-size: 14px;
            padding: 10px 0;
        }

        /* =========================================
           Botón Fijo de Tirar (Floating Action)
           ========================================= */
        .fixed-action-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 20px;
            padding-bottom: calc(20px + var(--safe-bottom));
            background: rgba(242, 242, 247, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            z-index: 100;
        }

        .spin-btn {
            width: 100%;
            max-width: 350px;
            background-color: var(--text-primary);
            color: white;
            border: none;
            padding: 18px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: 700;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
        }

        .spin-btn:active { transform: scale(0.96); }
        .spin-btn:disabled { background-color: var(--text-secondary); cursor: not-allowed; }

    </style>
</head>
<body>

    <header>
        <h1>Villa Arriba</h1>
        <div class="subtitle">Jenga Colors</div>
    </header>

    <div class="container">
        
        <!-- Ruleta -->
        <div class="roulette-wrapper">
            <div class="pointer"></div>
            <div class="wheel" id="wheel"></div>
        </div>

        <!-- Resultado de la Ruleta -->
        <div class="result-card" id="resultCard">
            <div class="result-title">Bloque a retirar</div>
            <div class="result-color" id="resultText">-</div>
        </div>

        <!-- Gestión de Jugadores -->
        <div class="players-section">
            <div class="players-header">Jugadores</div>
            
            <form class="add-player-form" id="addPlayerForm">
                <input type="text" class="add-player-input" id="playerNameInput" placeholder="Nombre del jugador..." autocomplete="off">
                <button type="submit" class="add-btn">Añadir</button>
            </form>

            <ul class="players-list" id="playersList">
                <li class="empty-state" id="emptyState">Añade jugadores para llevar la cuenta de victorias.</li>
            </ul>
        </div>

    </div>

    <!-- Botón de Girar -->
    <div class="fixed-action-bar">
        <button class="spin-btn" id="spinBtn">Girar Ruleta</button>
    </div>

    <script>
        /* =========================================
           LÓGICA DE LA RULETA
           ========================================= */
        const wheel = document.getElementById('wheel');
        const spinBtn = document.getElementById('spinBtn');
        const resultCard = document.getElementById('resultCard');
        const resultText = document.getElementById('resultText');

        let isSpinning = false;
        let currentRotation = 0;

        // Definimos los cortes de conic-gradient (cada 60 grados)
        // El grado 0 en conic-gradient está a las 12 en punto.
        const segments = [
            { name: 'Rosa Claro', color: 'var(--rosa-claro)', fontColor: '#FF3377', min: 0, max: 60 },
            { name: 'Rosa Oscuro', color: 'var(--rosa-oscuro)', fontColor: '#FF3377', min: 60, max: 120 },
            { name: 'Verde Claro', color: 'var(--verde-claro)', fontColor: '#33CC55', min: 120, max: 180 },
            { name: 'Verde Oscuro', color: 'var(--verde-oscuro)', fontColor: '#228B22', min: 180, max: 240 },
            { name: 'Azul Claro', color: 'var(--azul-claro)', fontColor: '#0066FF', min: 240, max: 300 },
            { name: 'Azul Oscuro', color: 'var(--azul-oscuro)', fontColor: '#0044CC', min: 300, max: 360 }
        ];

        spinBtn.addEventListener('click', () => {
            if (isSpinning) return;
            isSpinning = true;
            spinBtn.disabled = true;
            
            resultCard.classList.remove('active');

            // De 6 a 12 vueltas completas + grados aleatorios
            const extraSpins = Math.floor(Math.random() * 6 + 6) * 360; 
            const randomDegree = Math.floor(Math.random() * 360);
            
            currentRotation += (extraSpins + randomDegree);
            
            // Aplicamos rotación horario
            wheel.style.transform = `rotate(${currentRotation}deg)`;

            setTimeout(() => {
                isSpinning = false;
                spinBtn.disabled = false;

                // Calculamos qué color ha quedado arriba
                // Como giramos en horario, el puntero "0" se mueve hacia atrás relativo a la rueda
                const actualDegree = currentRotation % 360;
                const pointerAngle = (360 - actualDegree) % 360;

                const winningSegment = segments.find(s => pointerAngle >= s.min && pointerAngle < s.max);

                resultText.textContent = winningSegment.name;
                resultText.style.color = winningSegment.fontColor;
                resultCard.classList.add('active');

            }, 4000); // 4s coincidiendo con la transición CSS
        });

        /* =========================================
           LÓGICA DE JUGADORES (SCOREBOARD)
           ========================================= */
        const addPlayerForm = document.getElementById('addPlayerForm');
        const playerNameInput = document.getElementById('playerNameInput');
        const playersList = document.getElementById('playersList');
        const emptyState = document.getElementById('emptyState');

        // Estado de la aplicación
        let players = [];

        function renderPlayers() {
            // Limpiamos la lista
            playersList.innerHTML = '';

            if (players.length === 0) {
                playersList.appendChild(emptyState);
                emptyState.style.display = 'block';
                return;
            }

            emptyState.style.display = 'none';

            players.forEach((player, index) => {
                const li = document.createElement('li');
                li.className = 'player-item';
                
                li.innerHTML = `
                    <span class="player-name">${player.name}</span>
                    <div class="score-controls">
                        <span class="score-badge">${player.score}</span>
                        <button class="win-btn" onclick="addScore(${index})">+</button>
                    </div>
                `;
                playersList.appendChild(li);
            });
        }

        addPlayerForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const name = playerNameInput.value.trim();
            if (name === '') return;

            players.push({ name: name, score: 0 });
            playerNameInput.value = '';
            
            // Ocultar teclado en móviles
            playerNameInput.blur(); 
            
            renderPlayers();
        });

        // Función global para poder ser llamada desde el HTML dinámico
        window.addScore = function(index) {
            players[index].score += 1;
            renderPlayers();
        };

        // Render inicial
        renderPlayers();

    </script>
</body>
</html>
